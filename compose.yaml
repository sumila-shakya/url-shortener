services:
  api:
    image: url_shortener_api
    build:
      context: ./server
      target: dev
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      BASE_URL: http://localhost:3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: url_shortener
      MONGODB_URL: mongodb://mongo:27017/url_shortener
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server:/app             
      - /app/node_modules        
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: url_shortener     
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  mongo_data:
  redis_data: